name: Performance Testing

on:
  push:
    branches: [ main ]

jobs:
  performance-test:
    runs-on: ubuntu-latest
    env:
      JMETER_THREADS: 10

    steps:
    -  name: Checkout node
       uses: actions/checkout@v4

    -  name: setup JAVA
       uses: actions/setup-java@v4
       with:
         distribution: 'temurin'
         java-version: '17'

    -  name: install jmeter 
       run: |
         JMETER_VERSION=5.6.3
         wget -q https://downloads.apache.org/jmeter/binaries/apache-jmeter-${JMETER_VERSION}.tgz 
         tar -xzf apache-jmeter-${JMETER_VERSION}.tgz
         echo "JMETER_HOME=$(pwd)/apache-jmeter-${JMETER_VERSION}" >> $GITHUB_ENV
         echo "$(pwd)/apache-jmeter-${JMETER_VERSION}/bin" >> $GITHUB_PATH
    
    -  name: create results directory
       run: mkdir -p results

    -  name: Run jmeter
       run: |
         $JMETER_HOME/bin/jmeter -n -t test2.jmx -l results/results.jtl -e -o results/reports 

    -  name: Upload jmeter report
       uses: actions/upload-artifact@v4
       if: always()
       with:
         name: jmeter-report
         path: results/reports
         retention-days: 30

    -  name: Upload jtl results
       uses: actions/upload-artifact@v4
       if: always()
       with:
         name: jmeter-jtl
         path: results/results.jtl
         retention-days: 30
